<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label>enter your name:</label>
        <input type="text" id="username" name="username" placeholder="enter name:">
        <br><br>

        <label>enter your mailid:</label>
        <input type="email" name="email" placeholder="email:">
        <br><br>

        <label>enter your passward</label>
        <input type="password" name="password">
        <br><br>

        <label>enter age:</label>
        <input type="text">
        <br><br>
        <label>enter age:</label>
        <input type="number">
        <br><br>
        
        <label>enter gender:</label>
        <br>
        <label>male:</label><input type="radio" name="gender"  value="male"><br>
        <label>female:</label><input type="radio" name="gender"   value="female">
        <br><br>

        <label>Address:</label>
        <input type="textarea">
        <br><br>

        <label for="phno">Enter the phone number:</label>
        <input type="text" id="phno" required>
        <br><br>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date">
        <br><br>

        <label>Enter the url:</label>
        <input type="url">
        <br><br>

        <label for="time">Time:</label>
        <input type="time" id="time">
        <br><br>

        <label>
            <input type="checkbox" name="option1" value="Option 1"> Option 1
        </label>
        <label>
            <input type="checkbox" name="option2" value="Option 2"> Option 2
        </label>
        <br><br>

        <label>
            <input type="radio" name="gender" value="male"> Male
        </label>
        <label>
            <input type="radio" name="gender" value="female"> Female
        </label>
        <br><br>

        <label for="fileUpload">Upload your file:</label>
        <input type="file" id="fileUpload" name="fileUpload" accept=".jpg, .png, .pdf">
        <br><br>

        <label for="volume">Volume:</label>
        <input type="range" id="volume" name="volume" min="0" max="100" value="50">
        <br><br>

        <input type="reset">
        <input type="submit" value="Submit">
        <button type="submit">Submit</button>
    </form>
</body>
</html>
