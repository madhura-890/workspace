<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="fruit">Select fruit</label>
        <select id="fruit">
            <option value="apple">Apple</option>
            <option value="banaba">Banana</option>
            <option value="kiwi">Kiwi</option>
            <option value="strawberry">Strawberry</option>
        </select>
        <br><br>

        <label for="feedback">Feedback area:</label>
        <textarea id="feedback" rows="5" columns="10"></textarea>
        <br><br>

        <!-- Fieldset: used to group all the related information of the forms into single set.-->
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <br><br>
            <label for="phone">Number:</label>
            <input type="tel" id="phone" name="phone">
        </fieldset>
        <br><br>

        <fieldset>
            <legend>College Details</legend>
            <label for="usn">USN:</label>
            <input type="text" id="usn" name="usn">
            <br><br>
            <label for="branch">Branch:</label>
            <input type="text" id="branch" name="branch">
        </fieldset>
    </form>
</body>
</html>
