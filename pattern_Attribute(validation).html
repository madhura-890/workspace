<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>Username:</label>
    <input type="text" title="Enter username">
    <br><br>
    <label for="password">Password:</label>
    <input type="password" pattern="\d{3}-\d{3}-\d{4}" title="Enter password">
    <br><br>
    <label for="password">Password:</label>
    <input type="password" pattern="[A-Za-z]{3}" title="Enter password">
    <br><br>
    <label for="password">Password:</label>
    <input type="password" pattern="[A-Z]{2,}[a-z]{3,}[0-9]{2,}" title="Enter password">
    <br><br>
    <label for="password">Password:</label>
    <input type="password" pattern=".{8}" title="Enter password with atleast 8 characters">
    <br><br>
    <label for="password">Password:</label>
    <input type="password" pattern="[A-Za-z\d@#$%&?!*]{8,}" title="Enter password including'A-Za-z\d@#$%&?!*'">
    <br><br>

    <!--   (?=.*[a-z]): At least one lowercase letter.

            (?=.*[A-Z]): At least one uppercase letter.

            (?=.*\d): At least one digit.

            [A-Za-z\d]{8,}: Only allows uppercase, lowercase, and digits, with a minimum of 8 characters.

            Dot . with * (Wildcard):

            Regex: .*-->
    
    
    <br><br>
    <label for="password">Password:</label>
    <input type="password" pattern="^   ( ?= .* [a-z])  (?= .* [A-Z])  (?=.*\d)  [A-Za-z\d]{8,}$" title="Enter password including'A-Za-z\d@#$%&?!*'">
    <br><br>

    <label for="password">Password:</label>
    <input type="password" pattern="^(?=.*[a-z]) (?=.*[A-Z]) (?=.*\d) (?=.*[@$!%*?&#]) [A-Za-z\d@$!%*?&#]{12,}$" title="Enter password including'A-Za-z\d@#$%&?!*'">
    <br><br>

    <!--  (?=(.*\d){2,}): Ensure at least 2 digits.

            (?=(.*[A-Z]){2,}): Ensure at least 2 uppercase letters.

            (?=.*[!#%*]): Ensure at least one special character from the set !#%*.

            [A-Za-z\d!#%*]{10,}: Only allows uppercase, lowercase, digits, and certain special characters, with a minimum length of 10 characters.-->
            
    <label for="password">Password:</label>
    <input type="password" pattern="^(?=(.*\d){2,})(?=(.*[A-Z]){2,})(?=.*[!#%*])[A-Za-z\d!#%*]{10,}$" title="Enter password including'A-Za-z\d@#$%&?!*'">
    <input type="submit" value="Submit">
</body>
</html>
